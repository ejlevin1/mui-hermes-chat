name: ci
on: [push, pull_request, workflow_dispatch]
jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci && npm run typecheck && npm test && npm run build
  secrets:
    name: secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Install gitleaks 8.30.1
        run: |
          d="$(mktemp -d)"
          curl -sSfL -o "$d/gitleaks.tgz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar -xzf "$d/gitleaks.tgz" -C "$d" gitleaks
          sudo install "$d/gitleaks" /usr/local/bin/gitleaks
      - run: gitleaks git --redact --no-banner --config .gitleaks.toml --log-opts=--all
