title = "mui-hermes-chat gitleaks config"

[extend]
useDefault = true

[[rules]]
id = "home-dir-path"
description = "Absolute home directory path (leaks a username)"
regex = '''(?:/Users|/home)/[A-Za-z0-9._-]+/'''
tags = ["path", "privacy"]

[[rules]]
id = "private-ipv4"
description = "RFC1918 private IPv4 address"
regex = '''\b(?:10\.(?:\d{1,3})\.(?:\d{1,3})\.(?:\d{1,3})|172\.(?:1[6-9]|2\d|3[01])\.(?:\d{1,3})\.(?:\d{1,3})|192\.168\.(?:\d{1,3})\.(?:\d{1,3}))\b'''
tags = ["network", "privacy"]

[[rules]]
id = "mdns-hostname"
description = "mDNS .local host name"
regex = '''(?i)\b[a-z0-9][a-z0-9-]*\.local\b'''
tags = ["network", "privacy"]

[allowlist]
description = "Config file itself and lockfile"
paths = [
  '''^\.gitleaks\.toml$''',
  '''^package-lock\.json$''',
]
